<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded async: as a plain stylesheet this blocks first paint on a
         third-party host, so a slow or unreachable fonts.googleapis.com holds
         the whole app back. media="print" makes it non-blocking, and onload
         promotes it once it arrives; the <noscript> covers scripting-off. The
         stack in --font-sans/--font-mono renders meanwhile. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
    <meta
      name="description"
      content="Generate, validate, decode, and convert IDs in the browser: UUID (v1/v4/v6/v7), ULID, and NanoID. Batch, format, copy, and download, all keyboard-first."
    />
    <meta
      name="keywords"
      content="ID generator, UUID generator, UUID validator, ULID, NanoID, RFC 4122, UUID v4, UUID v7, developer tools"
    />
    <meta name="author" content="Pyae Thu Aung" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="idlab" />
    <!-- One unscoped tag. The in-app toggle overrides the OS setting, so a
         media-scoped pair cannot describe the background that is actually
         painted; useBrowserThemeSync rewrites this from the live --bg on
         every theme change. The boot value is the dark --bg, the default. -->
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="idlab" />
    <meta name="format-detection" content="telephone=no" />
    <link
      rel="canonical"
      href="https://pyaethu-aung.github.io/idlab"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="idlab: UUID, ULID &amp; NanoID toolkit" />
    <meta
      property="og:description"
      content="Generate, validate, decode, and convert IDs in the browser: UUID (v1/v4/v6/v7), ULID, and NanoID. Keyboard-first."
    />
    <meta
      property="og:url"
      content="https://pyaethu-aung.github.io/idlab"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="idlab: UUID, ULID &amp; NanoID toolkit" />
    <meta
      name="twitter:description"
      content="Generate, validate, decode, and convert IDs in the browser: UUID (v1/v4/v6/v7), ULID, and NanoID. Keyboard-first."
    />
    <title>idlab: UUID, ULID &amp; NanoID toolkit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
